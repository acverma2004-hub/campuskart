spring.application.name=campuskart-api
server.port=8080

# show our error messages (like "only 2 left") to the Angular app
server.error.include-message=always

# --- Database: H2 (default, nothing to install) ---
spring.datasource.url=jdbc:h2:file:./data/campuskart
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# open http://localhost:8080/h2-console to look at the tables

# --- Database: MySQL (comment out the H2 block above and use this instead) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/campuskart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password_here

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
